org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Kotlin's incremental compiler relativizes cache paths against the
# project root, which throws ("this and base files have different
# roots") when a dependency lives on a different drive letter than the
# project (e.g. project on D:, pub-cache on C:, both normal on Windows).
# Full (non-incremental) compilation avoids that path-relativization bug.
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template. Left false: our
# installed Flutter version's own Gradle plugin still targets AGP's OLD DSL
# interface internally (AbstractAppExtension) -- setting this to true makes
# "Starting AGP 9+, only the new DSL interface will be read" break the
# Flutter Gradle plugin's own plugin-application step outright. Needs a
# Flutter SDK upgrade to revisit.
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template. Also left
# false: tried flipping it alone (independent of newDsl above) to drop
# mobile_scanner (>=7.4.0, which supports this) out of the KGP warning, but
# it broke firebase_core instead -- a plugin that isn't even in the KGP
# warning list, so its "applies kotlin-android before com.android.library"
# ordering was never audited for AGP 9 compatibility. Revisit once more of
# the plugin ecosystem (not just the 3 named in the warning) has migrated.
android.builtInKotlin=false
